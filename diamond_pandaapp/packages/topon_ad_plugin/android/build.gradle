group = "com.toponad.topon_ad_plugin"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jfrog.anythinktech.com/artifactory/overseas_sdk" }
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.12.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()

        // ✅ Anythink (Core)
        maven { url "https://jfrog.anythinktech.com/artifactory/overseas_sdk" }

        // ✅ IronSource
        maven { url "https://android-sdk.is.com/" }

        // ✅ Mintegral
        maven { url "https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea" }
    }
}

apply plugin: "com.android.library"

android {
    namespace = "com.toponad.topon_ad_plugin"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk = 24
    }

    testOptions {
        unitTests.all {
            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
}

dependencies {
    // ✅ Anythink (Necessary)
    api "com.anythink.sdk:core-tpn:6.6.40"

    // ✅ AndroidX (Necessary)
    api "androidx.appcompat:appcompat:1.7.1"
    api "androidx.browser:browser:1.9.0"

    // ✅ UnityAds
    api "com.anythink.sdk:adapter-tpn-unityads:4.20.0.1.0"
    api "com.unity3d.ads:unity-ads:4.20.0"

    // ✅ IronSource (LevelPlay)
    api "com.anythink.sdk:adapter-tpn-ironsource:9.2.0.1.2"
    api "com.unity3d.ads-mediation:mediation-sdk:9.2.0"
    api "com.google.android.gms:play-services-appset:16.0.2"
    api "com.google.android.gms:play-services-ads-identifier:18.0.1"
    api "com.google.android.gms:play-services-basement:18.1.0"

    // ✅ Facebook Audience Network
    api "com.anythink.sdk:adapter-tpn-facebook:6.22.0.1.0"
    api "com.facebook.android:audience-network-sdk:6.22.0"
    api "androidx.annotation:annotation:1.9.1"

    // ✅ AdMob
    api "com.anythink.sdk:adapter-tpn-admob:25.4.0.1.1"
    api "com.google.android.gms:play-services-ads:25.4.0"

    // ✅ InMobi
    api "com.anythink.sdk:adapter-tpn-inmobi:11.4.0.1.1"
    api "com.inmobi.monetization:inmobi-ads-kotlin:11.4.0"

    // ✅ Anythink Adx SDK (Necessary)
    api "com.anythink.sdk:adapter-tpn-sdm:6.5.79.1.0"
    api "com.smartdigimkttech.sdk:smartdigimkttech-sdk:6.5.79"

    // ✅ AppLovin
    api "com.anythink.sdk:adapter-tpn-applovin:13.6.3.1.0"
    api "com.applovin:applovin-sdk:13.6.3"

    // ✅ Mintegral
    api "com.anythink.sdk:adapter-tpn-mintegral:17.1.71.1.0"
    api "com.mbridge.msdk.oversea:mbridge_android_sdk:17.1.71"
    api "androidx.recyclerview:recyclerview:1.4.0"

    // ✅ Tramini
    api "com.anythink.sdk:tramini-plugin-tpn:6.6.40"
}