name: topon_ad_plugin
description: A Flutter plugin for integrating TopOn Ads using Method Channels. Supports interstitial, rewarded, banner, native, and splash ads.
version: 0.0.10
homepage: https://www.toponad.com
topics:
  - ads
  - topon
  - interstitial
  - rewarded
  - monetization

environment:
  sdk: ^3.7.0
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  plugin:
    platforms:
      android:
        package: com.toponad.topon_ad_plugin
        pluginClass: ToponAdPlugin