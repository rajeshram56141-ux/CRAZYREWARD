name: crazyreward
description: "Crazyreward Flutter application."
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # FIREBASE SERVICES
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.1.1
  firebase_analytics: ^12.1.0
  firebase_messaging: ^16.2.2
  cloud_functions: ^6.0.5

  # USER INTERFACE
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  country_pickers: ^3.0.1
  styled_text: ^9.0.0
  google_fonts: ^6.2.1
  lottie: ^3.1.2

  # APP MANAGEMENT
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.2.1
  auto_route: ^10.2.6
  play_install_referrer: ^0.5.0
  easy_localization: ^3.0.8
  get_storage: ^2.1.1
  dio: ^5.9.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  flutter_web_browser: ^0.17.3
  connectivity_plus: ^7.0.0
  app_settings: ^7.0.0
  topon_ad_plugin:
    path: ./packages/topon_ad_plugin
  bitlabs: ^4.0.0
  onesignal_flutter: ^5.4.6
  firebase_app_check: ^0.4.2
  growdeck_playtime_plugin: ^1.0.0
  safe_device: ^1.1.4
  encrypt: ^5.0.3
  path_provider: ^2.1.3
  crypto: ^3.0.3
  pointycastle: ^3.9.1
  http: ^1.2.1
  android_id: ^0.4.0
  share_plus: ^10.0.0
  package_info_plus: ^8.0.0
  advertising_id: ^2.4.0
  
  cpx_research_sdk_flutter: 
    git:
      url: https://github.com/MakeOpinionGmbH/cpx-research-SDK-Flutter.git
      path: cpx_research_sdk_flutter
      
  pubscale_plugin:
    path: ./packages/pubscale_plugin

  playtime_ads:
    path: ./packages/playtime_ads
  audioplayers: ^6.7.1
  vibration: ^3.2.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.9.0
  auto_route_generator: ^10.0.1
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icons/DIAMONDPANDA_LOGO.png"
  min_sdk_android: 21
  adaptive_icon_background: "#101010"
  adaptive_icon_foreground: "assets/icons/DIAMONDPANDA_LOGO.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/LOGO_SPLASHS.png
  color_dark: "#FFFFFF"
  image_dark: assets/icons/LOGO_SPLASHS.png
  android: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/locale/
    - assets/animations/
    
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf

    - family: GamerStation
      fonts:
        - asset: assets/fonts/GamerStation.ttf

    - family: Neogen
      fonts:
        - asset: assets/fonts/Neogen-Black.ttf